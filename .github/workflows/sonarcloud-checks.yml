name: SonarCloud
on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, synchronize, reopened ]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'zulu' # Alternative distribution options are available.
      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      # Build + test + jacoco on JDK 17. Skip Sonar here (it requires Java 21+).
      - name: Build and test (JDK 17)
        env:
          USER_NAME: ${{ secrets.PPE_USER_NAME }}
          ACCESS_TOKEN: ${{ secrets.PPE_ACCESS_TOKEN }}
        run: mvn -B -Pcoverage verify -Dsonar.skip=true

      # Switch the JVM to 21 ONLY to run the SonarCloud scanner.
      - name: Set up JDK 21 for Sonar
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'zulu'

      - name: SonarCloud analysis (JDK 21)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B -Pcoverage sonar:sonar -Dsonar.projectKey=PhonePe_mustang
